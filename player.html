<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tool 4: 影音播放與切片機 (Player & Cutter Pro)</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #161f30;
      --accent: #00f2fe;
      --accent-glow: rgba(0, 242, 254, 0.4);
      --text: #e2e8f0;
      --danger: #ff4757;
      --warning: #ffa502;
      --success: #2ed573;
    }
    body {
      margin: 0;
      padding: 12px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 540px;
      background: var(--card-bg);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      border: 1px solid #1e293b;
    }
    h2 {
      margin: 0 0 12px 0;
      font-size: 1.15rem;
      color: var(--accent);
      text-align: center;
      letter-spacing: 1px;
    }
    .video-wrapper {
      width: 100%;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 12px;
      border: 1px solid #334155;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 200px;
    }
    video {
      width: 100%;
      max-height: 300px;
      display: block;
      background: #000;
    }
    .file-box {
      margin-bottom: 12px;
      text-align: center;
    }
    input[type="file"] {
      display: none;
    }
    .btn-file {
      display: inline-block;
      padding: 10px 18px;
      background: #1e293b;
      color: var(--accent);
      border: 1px dashed var(--accent);
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.9rem;
      box-shadow: 0 0 10px rgba(0,242,254,0.15);
    }
    .track-name {
      margin-top: 6px;
      font-size: 0.8rem;
      color: #94a3b8;
      word-break: break-all;
    }

    /* 📚 無限新增切片清單樣式 */
    .playlist-wrapper {
      background: #090e17;
      border: 1px solid #1e293b;
      border-radius: 10px;
      padding: 8px;
      margin: 10px 0 14px 0;
      max-height: 180px;
      overflow-y: auto;
    }
    .playlist-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      color: #64748b;
      padding: 2px 6px 6px 6px;
      border-bottom: 1px solid #1e293b;
      margin-bottom: 6px;
    }
    .playlist-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .playlist-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 10px;
      background: #131b2b;
      border-radius: 6px;
      font-size: 0.8rem;
      color: #cbd5e1;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.2s ease;
    }
    .playlist-item:hover {
      background: #1c273e;
      border-color: #334155;
    }
    /* 🔥 播放中狀態：強烈 Neon Shadow + 下劃線 Underline Glow */
    .playlist-item.playing {
      background: #102338;
      color: #00f2fe;
      font-weight: bold;
      border: 1px solid #00f2fe;
      border-bottom: 3px solid #00f2fe; /* 標誌性發光底線 */
      box-shadow: 0 0 14px rgba(0, 242, 254, 0.45); /* 立體外發光 Shadow */
    }
    .item-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
      margin-right: 8px;
    }
    .btn-del-item {
      background: transparent;
      border: none;
      color: #64748b;
      font-size: 0.85rem;
      padding: 2px 6px;
      cursor: pointer;
    }
    .btn-del-item:hover {
      color: var(--danger);
    }

    .progress-section {
      margin: 10px 0;
    }
    .time-info {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: #94a3b8;
      font-family: monospace;
      margin-bottom: 4px;
    }
    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
      cursor: pointer;
    }
    .controls-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin: 10px 0;
    }
    button {
      background: #1e293b;
      color: var(--text);
      border: 1px solid #334155;
      padding: 10px 6px;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.15s ease;
    }
    button:active {
      transform: scale(0.96);
      background: #334155;
    }
    .btn-play {
      background: var(--accent);
      color: #0b0f19;
      font-weight: bold;
      grid-column: span 4;
      padding: 12px;
      font-size: 1.05rem;
      border: none;
      box-shadow: 0 0 15px var(--accent-glow);
    }
    .section-box {
      background: #0f172a;
      border-radius: 10px;
      padding: 12px;
      margin-top: 10px;
      border: 1px solid #1e293b;
    }
    .slider-row {
      margin: 6px 0;
    }
    .slider-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      margin-bottom: 2px;
    }
    .loop-controls {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    .loop-controls button {
      flex: 1;
    }
    .btn-active {
      background: var(--warning) !important;
      color: #000 !important;
      font-weight: bold;
    }
    .btn-cut {
      width: 100%;
      margin-top: 10px;
      background: var(--success);
      color: #000;
      font-weight: bold;
      font-size: 0.95rem;
      border: none;
      padding: 12px;
      box-shadow: 0 0 12px rgba(46, 213, 115, 0.4);
    }
  </style>
</head>
<body>

<div class="container">
  <h2>🎬 影音播放與切片一體機 (Pro)</h2>

  <div class="video-wrapper">
    <video id="mediaPlayer" playsinline></video>
  </div>

  <div class="file-box">
    <!-- 支援 multiple 多選與無限追加 -->
    <label class="btn-file" for="mediaInput">📂 選擇或批量新增檔案 (MP4/OPUS/MP3/WAV)</label>
    <input type="file" id="mediaInput" accept="video/*,audio/*" multiple>
    <div id="trackName" class="track-name">未載入檔案</div>
  </div>

  <!-- 📚 無限新增切片清單 -->
  <div class="playlist-wrapper" id="playlistWrapper">
    <div class="playlist-header">
      <span>📚 已載入清單 (<span id="playlistCount">0</span>)</span>
      <span style="font-size:0.7rem; color:var(--accent);">自動順播中 ➔</span>
    </div>
    <ul class="playlist-list" id="playlist"></ul>
  </div>

  <div class="progress-section">
    <div class="time-info">
      <span id="currentTime">00:00.0</span>
      <span id="durationTime">00:00.0</span>
    </div>
    <input type="range" id="seekSlider" min="0" value="0" step="0.05">
  </div>

  <button id="btnPlay" class="btn-play">▶ 播放</button>

  <div class="controls-grid">
    <button id="btnBack5">⏪ -5s</button>
    <button id="btnBack05">◀ -0.5s</button>
    <button id="btnFwd05">▶ +0.5s</button>
    <button id="btnFwd5">⏩ +5s</button>
  </div>

  <!-- 速度與 Pitch -->
  <div class="section-box">
    <div class="slider-row">
      <div class="slider-label">
        <span>變速 (Speed) - 保持音調</span>
        <span id="valSpeed">1.00x</span>
      </div>
      <input type="range" id="speedSlider" min="0.25" max="2.0" step="0.05" value="1.0">
    </div>
    <div class="slider-row" style="margin-top:10px;">
      <div class="slider-label">
        <span>音調微調 (Pitch / 半音)</span>
        <span id="valPitch">0 半音</span>
      </div>
      <input type="range" id="pitchSlider" min="-6" max="6" step="1" value="0">
    </div>
  </div>

  <!-- AB 點鎖定與一鍵剪片 -->
  <div class="section-box">
    <div class="slider-label">
      <span>✂️ AB 採樣剪輯區間</span>
      <span id="loopStatus" style="color:var(--accent);">未設定</span>
    </div>
    <div class="loop-controls">
      <button id="btnSetA">📍 設為 A 點</button>
      <button id="btnSetB">🏁 設為 B 點</button>
      <button id="btnClearLoop" style="color:var(--danger);">重設</button>
    </div>
    <button id="btnExportWav" class="btn-cut">💾 導出 AB 區間無損音效 (.wav)</button>
  </div>
</div>
<script>
  const player = document.getElementById('mediaPlayer');
  let currentFile = null;
  let loopA = null;
  let loopB = null;
  let isLooping = false;

  // 清單管理變數
  let fileList = [];
  let currentActiveIndex = -1;

  const mediaInput = document.getElementById('mediaInput');
  const trackName = document.getElementById('trackName');
  const btnPlay = document.getElementById('btnPlay');
  const seekSlider = document.getElementById('seekSlider');
  const currentTimeLabel = document.getElementById('currentTime');
  const durationTimeLabel = document.getElementById('durationTime');

  const playlistUl = document.getElementById('playlist');
  const playlistCount = document.getElementById('playlistCount');

  const speedSlider = document.getElementById('speedSlider');
  const valSpeed = document.getElementById('valSpeed');
  const pitchSlider = document.getElementById('pitchSlider');
  const valPitch = document.getElementById('valPitch');

  const btnSetA = document.getElementById('btnSetA');
  const btnSetB = document.getElementById('btnSetB');
  const btnClearLoop = document.getElementById('btnClearLoop');
  const loopStatus = document.getElementById('loopStatus');
  const btnExportWav = document.getElementById('btnExportWav');

  function fmt(sec) {
    if (isNaN(sec)) return "00:00.0";
    let m = Math.floor(sec / 60);
    let s = Math.floor(sec % 60);
    let ms = Math.floor((sec % 1) * 10);
    return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s + "." + ms;
  }

  // 📂 監聽新增檔案（支援累加、無限追加）
  mediaInput.addEventListener('change', (e) => {
    const files = Array.from(e.target.files);
    if (!files.length) return;

    files.forEach(f => fileList.push(f));
    renderPlaylist();

    // 如果未有播緊歌，自動載入今次加入嘅第一隻
    if (currentActiveIndex === -1) {
      loadTrack(0, false);
    }
    mediaInput.value = ""; // 重設 input，方便重複揀選同一個檔
  });

  // 渲染清單（帶發光 Shadow 與 Underline）
  function renderPlaylist() {
    playlistUl.innerHTML = "";
    playlistCount.textContent = fileList.length;

    fileList.forEach((file, idx) => {
      const li = document.createElement('li');
      li.className = 'playlist-item' + (idx === currentActiveIndex ? ' playing' : '');
      
      const titleSpan = document.createElement('span');
      titleSpan.className = 'item-title';
      titleSpan.textContent = `${idx === currentActiveIndex ? '🎵 ' : ''}${idx + 1}. ${file.name}`;
      
      const delBtn = document.createElement('button');
      delBtn.className = 'btn-del-item';
      delBtn.innerHTML = '&times;';
      delBtn.title = "移除";
      delBtn.onclick = (ev) => {
        ev.stopPropagation();
        removeTrack(idx);
      };

      li.appendChild(titleSpan);
      li.appendChild(delBtn);

      li.onclick = () => loadTrack(idx, true);
      playlistUl.appendChild(li);
    });
  }

  // 踢入去播放（支援自動連續開播）
  function loadTrack(idx, autoPlay = true) {
    if (!fileList[idx]) return;
    currentActiveIndex = idx;
    currentFile = fileList[idx];
    trackName.textContent = `▶ 正在處理: ${currentFile.name}`;

    const fileURL = URL.createObjectURL(currentFile);
    player.src = fileURL;
    player.preservesPitch = true;
    player.load();
    
    if (autoPlay) {
      player.play().then(() => {
        btnPlay.textContent = "⏸ 暫停";
      }).catch(() => {
        btnPlay.textContent = "▶ 播放";
      });
    } else {
      btnPlay.textContent = "▶ 播放";
    }

    clearLoop();
    renderPlaylist();
  }

  // 移除項目
  function removeTrack(idx) {
    fileList.splice(idx, 1);
    if (currentActiveIndex === idx) {
      if (fileList.length > 0) {
        loadTrack(Math.max(0, idx - 1), false);
      } else {
        currentActiveIndex = -1;
        currentFile = null;
        player.src = "";
        trackName.textContent = "未載入檔案";
        clearLoop();
      }
    } else if (currentActiveIndex > idx) {
      currentActiveIndex--;
    }
    renderPlaylist();
  }

  player.addEventListener('loadedmetadata', () => {
    seekSlider.max = player.duration;
    durationTimeLabel.textContent = fmt(player.duration);
  });

  player.addEventListener('timeupdate', () => {
    seekSlider.value = player.currentTime;
    currentTimeLabel.textContent = fmt(player.currentTime);

    // AB 點循環控制
    if (isLooping && loopB !== null && player.currentTime >= loopB) {
      player.currentTime = loopA || 0;
    }
  });

  // 🎵 順住播核心：播完一隻自動跳下一隻！
  player.addEventListener('ended', () => {
    if (isLooping && loopB !== null) return; // 開緊 AB 點循環採樣嗰陣唔跳歌

    if (fileList.length > 0) {
      let nextIndex = currentActiveIndex + 1;
      if (nextIndex >= fileList.length) {
        nextIndex = 0; // 播到最後一首自動循環返第一首
      }
      loadTrack(nextIndex, true);
    }
  });

  btnPlay.addEventListener('click', () => {
    if (!player.src) return;
    if (player.paused) {
      player.play();
      btnPlay.textContent = "⏸ 暫停";
    } else {
      player.pause();
      btnPlay.textContent = "▶ 播放";
    }
  });

  document.getElementById('btnBack5').addEventListener('click', () => { player.currentTime = Math.max(0, player.currentTime - 5); });
  document.getElementById('btnBack05').addEventListener('click', () => { player.currentTime = Math.max(0, player.currentTime - 0.5); });
  document.getElementById('btnFwd05').addEventListener('click', () => { player.currentTime = Math.min(player.duration, player.currentTime + 0.5); });
  document.getElementById('btnFwd5').addEventListener('click', () => { player.currentTime = Math.min(player.duration, player.currentTime + 5); });

  seekSlider.addEventListener('input', () => {
    player.currentTime = seekSlider.value;
  });

  speedSlider.addEventListener('input', (e) => {
    const spd = parseFloat(e.target.value);
    player.playbackRate = spd;
    valSpeed.textContent = spd.toFixed(2) + "x";
  });

  pitchSlider.addEventListener('input', (e) => {
    const semi = parseInt(e.target.value);
    valPitch.textContent = (semi > 0 ? "+" : "") + semi + " 半音";
    if (semi === 0) {
      player.preservesPitch = true;
    } else {
      player.preservesPitch = false;
      let factor = Math.pow(2, semi / 12);
      player.playbackRate = speedSlider.value * factor;
    }
  });

  btnSetA.addEventListener('click', () => {
    loopA = player.currentTime;
    btnSetA.classList.add('btn-active');
    btnSetA.textContent = "A: " + fmt(loopA);
    checkLoopActive();
  });

  btnSetB.addEventListener('click', () => {
    if (loopA === null) loopA = 0;
    loopB = player.currentTime;
    if (loopB <= loopA) loopB = loopA + 0.2;
    btnSetB.classList.add('btn-active');
    btnSetB.textContent = "B: " + fmt(loopB);
    checkLoopActive();
  });

  function checkLoopActive() {
    if (loopA !== null && loopB !== null) {
      isLooping = true;
      let len = (loopB - loopA).toFixed(2);
      loopStatus.textContent = `${fmt(loopA)} ➔ ${fmt(loopB)} (${len}s)`;
    }
  }

  function clearLoop() {
    loopA = null;
    loopB = null;
    isLooping = false;
    btnSetA.classList.remove('btn-active');
    btnSetB.classList.remove('btn-active');
    btnSetA.textContent = "📍 設為 A 點";
    btnSetB.textContent = "🏁 設為 B 點";
    loopStatus.textContent = "未設定";
  }

  btnClearLoop.addEventListener('click', clearLoop);

  btnExportWav.addEventListener('click', async () => {
    if (!currentFile) {
      alert("請先選擇檔案！");
      return;
    }
    if (loopA === null || loopB === null) {
      alert("請先設定 A 點同 B 點！");
      return;
    }

    const originalText = btnExportWav.textContent;
    btnExportWav.textContent = "⏳ 解碼切割中...";
    btnExportWav.disabled = true;

    try {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const arrayBuffer = await currentFile.arrayBuffer();
      const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);

      const sampleRate = audioBuffer.sampleRate;
      const startSample = Math.floor(loopA * sampleRate);
      const endSample = Math.min(Math.floor(loopB * sampleRate), audioBuffer.length);
      const frameCount = endSample - startSample;

      if (frameCount <= 0) {
        alert("選取範圍太短！");
        return;
      }

      const numChannels = audioBuffer.numberOfChannels;
      const cutBuffer = audioCtx.createBuffer(numChannels, frameCount, sampleRate);

      for (let i = 0; i < numChannels; i++) {
        const srcData = audioBuffer.getChannelData(i);
        const destData = cutBuffer.getChannelData(i);
        for (let j = 0; j < frameCount; j++) {
          destData[j] = srcData[startSample + j];
        }
      }

      const wavBlob = audioBufferToWavBlob(cutBuffer);
      const downloadUrl = URL.createObjectURL(wavBlob);
      const a = document.createElement('a');
      a.href = downloadUrl;
      a.download = `cut_${fmt(loopA).replace(/[:.]/g,'-')}_to_${fmt(loopB).replace(/[:.]/g,'-')}.wav`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);

    } catch (err) {
      alert("切片導出失敗: " + err.message);
    } finally {
      btnExportWav.textContent = originalText;
      btnExportWav.disabled = false;
    }
  });

  function audioBufferToWavBlob(buffer) {
    const numOfChan = buffer.numberOfChannels;
    const length = buffer.length * numOfChan * 2 + 44;
    const out = new DataView(new ArrayBuffer(length));
    let offset = 0;
    let pos = 0;

    function setUint16(data) { out.setUint16(pos, data, true); pos += 2; }
    function setUint32(data) { out.setUint32(pos, data, true); pos += 4; }

    setUint32(0x46464952); // "RIFF"
    setUint32(length - 8);
    setUint32(0x45564157); // "WAVE"
    setUint32(0x20746d66); // "fmt "
    setUint32(16);          // 16 bit
    setUint16(1);           // PCM
    setUint16(numOfChan);
    setUint32(buffer.sampleRate);
    setUint32(buffer.sampleRate * 2 * numOfChan);
    setUint16(numOfChan * 2);
    setUint16(16);
    setUint32(0x61746164); // "data"
    setUint32(length - pos - 4);

    const channels = [];
    for (let i = 0; i < buffer.numberOfChannels; i++) {
      channels.push(buffer.getChannelData(i));
    }

    while (pos < length) {
      for (let i = 0; i < numOfChan; i++) {
        let sample = Math.max(-1, Math.min(1, channels[i][offset]));
        sample = (0.5 + sample < 0 ? sample * 32768 : sample * 32767) | 0;
        out.setInt16(pos, sample, true);
        pos += 2;
      }
      offset++;
    }
    return new Blob([out], { type: 'audio/wav' });
  }
</script>
</body>
</html>
