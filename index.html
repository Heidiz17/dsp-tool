<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcatdia - DSP 音效調校與 Base64 烘焙實驗室</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #080b12; color: #fff; padding: 20px; display: flex; justify-content: center; }
        .box { width: 100%; max-width: 480px; background: rgba(16, 24, 40, 0.9); border: 1px solid #00ffcc; border-radius: 14px; padding: 20px; }
        h2 { color: #00ffcc; font-size: 20px; margin-bottom: 15px; text-align: center; }
        .group { margin-bottom: 18px; }
        label { display: block; font-size: 13px; color: #aaa; margin-bottom: 6px; }
        input[type="file"] { width: 100%; padding: 8px; background: #030508; border: 1px dashed #00ffcc; border-radius: 8px; color: #fff; font-size: 12px; }
        input[type="range"] { width: 100%; accent-color: #00ffcc; }
        .val-disp { float: right; color: #ffcc00; font-weight: bold; }
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        button { padding: 12px; font-weight: bold; border-radius: 8px; border: none; cursor: pointer; font-size: 13px; }
        .btn-play { background: #ffaa00; color: #000; }
        .btn-bake { background: #00ffcc; color: #000; grid-column: span 2; }
        textarea { width: 100%; height: 100px; margin-top: 15px; background: #030508; border: 1px solid #444; border-radius: 8px; color: #00ffcc; padding: 8px; font-size: 11px; word-break: break-all; resize: none; }
    </style>
</head>
<body>

<div class="box">
    <h2>🎛️ DSP 音效調校實驗室</h2>

    <div class="group">
        <label>1. 選擇你的 Coin / 打擊音檔 (MP3 或 WAV)：</label>
        <input type="file" id="audioInput" accept="audio/*">
    </div>

    <div class="group">
        <label>2. Pitch 音調調整：<span class="val-disp" id="pitchVal">1.35x (+高音)</span></label>
        <input type="range" id="pitchSlider" min="0.5" max="2.5" step="0.05" value="1.35">
    </div>

    <div class="group">
        <label>3. 預覽音量 (Volume)：<span class="val-disp" id="volVal">100%</span></label>
        <input type="range" id="volSlider" min="0.1" max="2.0" step="0.1" value="1.0">
    </div>

    <div class="btn-grid">
        <button class="btn-play" onclick="testPlay()">🔊 試聽手感</button>
        <button class="btn-play" style="background:#aa00ff; color:#fff;" onclick="testContinuousPlay()">🥁 連續敲擊 (4連打)</button>
        <button class="btn-bake" onclick="bakeAndExport()">✨ 烘焙為 DSP Base64 並複製</button>
    </div>

    <textarea id="outputBase64" placeholder="點擊上面綠色按鈕後，這裡會生成 Base64 代碼並自動複製..."></textarea>
</div>

<script>
let actx = null;
let originalBuffer = null;

function getAudioContext() {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    return actx;
}

document.getElementById('audioInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(evt) {
        const ctx = getAudioContext();
        ctx.decodeAudioData(evt.target.result, function(buffer) {
            originalBuffer = buffer;
            alert("✅ 音檔載入成功！長度：" + buffer.duration.toFixed(3) + " 秒");
        });
    };
    reader.readAsArrayBuffer(file);
});

const pitchSlider = document.getElementById('pitchSlider');
pitchSlider.addEventListener('input', function() {
    document.getElementById('pitchVal').innerText = this.value + "x " + (this.value > 1.0 ? "(高音)" : "(低音)");
});

const volSlider = document.getElementById('volSlider');
volSlider.addEventListener('input', function() {
    document.getElementById('volVal').innerText = Math.round(this.value * 100) + "%";
});

function testPlay(delay = 0) {
    if (!originalBuffer) { alert("請先選擇音檔！"); return; }
    const ctx = getAudioContext();
    const src = ctx.createBufferSource();
    const gain = ctx.createGain();

    src.buffer = originalBuffer;
    src.playbackRate.value = parseFloat(pitchSlider.value);

    gain.gain.value = parseFloat(volSlider.value);
    src.connect(gain);
    gain.connect(ctx.destination);

    src.start(ctx.currentTime + delay);
}

function testContinuousPlay() {
    for (let i = 0; i < 4; i++) {
        testPlay(i * 0.15); // 每 150ms 敲一下
    }
}

// 將變調後嘅聲音「烘焙」成真實 Audio，再編碼為 Base64
function bakeAndExport() {
    if (!originalBuffer) { alert("請先選擇音檔！"); return; }
    const pitch = parseFloat(pitchSlider.value);
    const newDuration = originalBuffer.duration / pitch;
    const sampleRate = originalBuffer.sampleRate;
    const frameCount = Math.ceil(newDuration * sampleRate);

    const offlineCtx = new OfflineAudioContext(originalBuffer.numberOfChannels, frameCount, sampleRate);
    const src = offlineCtx.createBufferSource();
    src.buffer = originalBuffer;
    src.playbackRate.value = pitch;
    src.connect(offlineCtx.destination);
    src.start(0);

    offlineCtx.startRendering().then(renderedBuffer => {
        const wavBlob = bufferToWaveBlob(renderedBuffer);
        const reader = new FileReader();
        reader.onloadend = function() {
            const base64data = reader.result;
            const output = document.getElementById('outputBase64');
            output.value = base64data;
            output.select();
            navigator.clipboard.writeText(base64data).then(() => {
                alert("🎉 搞掂！變調後嘅 DSP Base64 已經複製到剪貼簿！");
            }).catch(() => {
                alert("已生成代碼，請長按文字框手動複製！");
            });
        };
        reader.readAsDataURL(wavBlob);
    });
}

// 純 JS 將 AudioBuffer 壓做標準 WAV 二進制
function bufferToWaveBlob(abuffer) {
    let numOfChan = abuffer.numberOfChannels,
        length = abuffer.length * numOfChan * 2 + 44,
        out = new DataView(new ArrayBuffer(length)),
        channels = [], i, sample, offset = 0, pos = 0;

    function setUint16(data) { out.setUint16(pos, data, true); pos += 2; }
    function setUint32(data) { out.setUint32(pos, data, true); pos += 4; }

    setUint32(0x46464952); // "RIFF"
    setUint32(length - 8); 
    setUint32(0x45564157); // "WAVE"
    setUint32(0x20746d66); // "fmt "
    setUint32(16);         // PCM
    setUint16(1);          // Linear
    setUint16(numOfChan);
    setUint32(abuffer.sampleRate);
    setUint32(abuffer.sampleRate * 2 * numOfChan);
    setUint16(numOfChan * 2);
    setUint16(16);         // 16-bit
    setUint32(0x61746164); // "data"
    setUint32(length - pos - 4);

    for(i=0; i<abuffer.numberOfChannels; i++) channels.push(abuffer.getChannelData(i));

    while(offset < abuffer.length) {
        for(i=0; i<numOfChan; i++) {
            sample = Math.max(-1, Math.min(1, channels[i][offset]));
            sample = (0.5 + sample < 0 ? sample * 32768 : sample * 32767)|0;
            out.setInt16(pos, sample, true);
            pos += 2;
        }
        offset++;
    }
    return new Blob([out], { type: "audio/wav" });
}
</script>
</body>
</html>
