<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcatdia - DSP 自動切空氣音 & Base64 烘焙實驗室</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #080b12; color: #fff; padding: 20px; display: flex; justify-content: center; }
        .box { width: 100%; max-width: 480px; background: rgba(16, 24, 40, 0.95); border: 1px solid #00ffcc; border-radius: 14px; padding: 20px; box-shadow: 0 0 20px rgba(0,255,204,0.15); }
        h2 { color: #00ffcc; font-size: 20px; margin-bottom: 15px; text-align: center; }
        .group { margin-bottom: 18px; }
        label { display: block; font-size: 13px; color: #aaa; margin-bottom: 6px; }
        input[type="file"] { width: 100%; padding: 8px; background: #030508; border: 1px dashed #00ffcc; border-radius: 8px; color: #fff; font-size: 12px; }
        input[type="range"] { width: 100%; accent-color: #00ffcc; }
        .val-disp { float: right; color: #ffcc00; font-weight: bold; }
        .status-box { background: #030508; border: 1px solid #333; border-radius: 8px; padding: 10px; font-size: 12px; color: #00ffcc; margin-bottom: 15px; }
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        button { padding: 12px; font-weight: bold; border-radius: 8px; border: none; cursor: pointer; font-size: 13px; }
        .btn-play { background: #ffaa00; color: #000; }
        .btn-bake { background: #00ffcc; color: #000; grid-column: span 2; font-size: 14px; }
        textarea { width: 100%; height: 100px; margin-top: 15px; background: #030508; border: 1px solid #444; border-radius: 8px; color: #00ffcc; padding: 8px; font-size: 11px; word-break: break-all; resize: none; }
    </style>
</head>
<body>

<div class="box">
    <h2>🎛️ DSP 自動去空氣音實驗室</h2>

    <div class="group">
        <label>1. 選擇你的原始音檔 (MP3 / WAV)：</label>
        <input type="file" id="audioInput" accept="audio/*">
    </div>

    <div class="status-box" id="trimStatus">
        等待選擇檔案...（載入後會自動切走前後空氣音）
    </div>

    <div class="group">
        <label>2. Pitch 音調調整：<span class="val-disp" id="pitchVal">2.0x (高音)</span></label>
        <input type="range" id="pitchSlider" min="0.5" max="10.0" step="0.1" value="2.0">
    </div>

    <div class="group">
        <label>3. 預覽音量 (Volume)：<span class="val-disp" id="volVal">100%</span></label>
        <input type="range" id="volSlider" min="0.1" max="2.0" step="0.1" value="1.0">
    </div>

    <div class="btn-grid">
        <button class="btn-play" onclick="testPlay()">🔊 試聽打擊</button>
        <button class="btn-play" style="background:#aa00ff; color:#fff;" onclick="testContinuousPlay()">🥁 4連打手感</button>
        <button class="btn-bake" onclick="bakeAndExport()">✨ 自動裁切 + 烘焙極短 Base64</button>
    </div>

    <textarea id="outputBase64" placeholder="點擊綠色按鈕後，這裡會生成超短 Base64 並自動複製..."></textarea>
</div>

<script>
let actx = null;
let trimmedBuffer = null;

function getAudioContext() {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    return actx;
}

// 自動切走前後空氣音（Silence Trimming）
function autoTrimBuffer(buffer) {
    const threshold = 0.015; // 聲音觸發門檻
    const channelData = buffer.getChannelData(0);
    const totalFrames = channelData.length;
    let startFrame = 0;
    
    // 搵第一粒真正有聲的點（砍掉開頭靜音）
    for (let i = 0; i < totalFrames; i++) {
        if (Math.abs(channelData[i]) > threshold) {
            startFrame = Math.max(0, i - 50); // 保留極微小緩衝防爆音
            break;
        }
    }

    // 音遊打擊聲極限保留 0.09 秒即可，後面多餘的全部拋棄
    const maxFrames = Math.floor(buffer.sampleRate * 0.09);
    const endFrame = Math.min(totalFrames, startFrame + maxFrames);
    const frameCount = endFrame - startFrame;

    const ctx = getAudioContext();
    const newBuf = ctx.createBuffer(1, frameCount, buffer.sampleRate); // 轉單聲道大幅減低體積
    const newChan = newBuf.getChannelData(0);

    for (let i = 0; i < frameCount; i++) {
        // 自然極速淡出，避免音尾爆喀嗒聲
        const fade = (i > frameCount - 200) ? (frameCount - i) / 200 : 1.0;
        newChan[i] = channelData[startFrame + i] * fade;
    }

    return {
        buffer: newBuf,
        cutBefore: (startFrame / buffer.sampleRate).toFixed(3),
        finalDuration: (frameCount / buffer.sampleRate).toFixed(3)
    };
}

document.getElementById('audioInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(evt) {
        const ctx = getAudioContext();
        ctx.decodeAudioData(evt.target.result, function(buffer) {
            const res = autoTrimBuffer(buffer);
            trimmedBuffer = res.buffer;
            document.getElementById('trimStatus').innerHTML = 
                `⚡ <b>自動切除空氣音成功！</b><br>` +
                `✂️ 前頭靜音切走：${res.cutBefore} 秒<br>` +
                `🎯 精確打擊核心：保留超短 ${res.finalDuration} 秒`;
        });
    };
    reader.readAsArrayBuffer(file);
});

const pitchSlider = document.getElementById('pitchSlider');
pitchSlider.addEventListener('input', function() {
    document.getElementById('pitchVal').innerText = this.value + "x " + (this.value > 1.0 ? "(高音)" : "(低音)");
});

const volSlider = document.getElementById('volSlider');
volSlider.addEventListener('input', function() {
    document.getElementById('volVal').innerText = Math.round(this.value * 100) + "%";
});

function testPlay(delay = 0) {
    if (!trimmedBuffer) { alert("請先選擇音檔！"); return; }
    const ctx = getAudioContext();
    const src = ctx.createBufferSource();
    const gain = ctx.createGain();

    src.buffer = trimmedBuffer;
    src.playbackRate.value = parseFloat(pitchSlider.value);
    gain.gain.value = parseFloat(volSlider.value);

    src.connect(gain);
    gain.connect(ctx.destination);
    src.start(ctx.currentTime + delay);
}

function testContinuousPlay() {
    for (let i = 0; i < 4; i++) testPlay(i * 0.12);
}

function bakeAndExport() {
    if (!trimmedBuffer) { alert("請先選擇音檔！"); return; }
    const pitch = parseFloat(pitchSlider.value);
    const newDuration = trimmedBuffer.duration / pitch;
    const sampleRate = trimmedBuffer.sampleRate;
    const frameCount = Math.ceil(newDuration * sampleRate);

    const offlineCtx = new OfflineAudioContext(1, frameCount, sampleRate);
    const src = offlineCtx.createBufferSource();
    src.buffer = trimmedBuffer;
    src.playbackRate.value = pitch;
    src.connect(offlineCtx.destination);
    src.start(0);

    offlineCtx.startRendering().then(renderedBuffer => {
        const wavBlob = bufferToWaveBlob(renderedBuffer);
        const reader = new FileReader();
        reader.onloadend = function() {
            const base64data = reader.result;
            const output = document.getElementById('outputBase64');
            output.value = base64data;
            output.select();
            navigator.clipboard.writeText(base64data).then(() => {
                alert("🎉 搞掂！前後空氣音已切走，超短 Base64 複製好！");
            }).catch(() => {
                alert("請手動複製文字框內容！");
            });
        };
        reader.readAsDataURL(wavBlob);
    });
}

function bufferToWaveBlob(abuffer) {
    let numOfChan = 1,
        length = abuffer.length * 2 + 44,
        out = new DataView(new ArrayBuffer(length)),
        pos = 0;

    function setUint16(data) { out.setUint16(pos, data, true); pos += 2; }
    function setUint32(data) { out.setUint32(pos, data, true); pos += 4; }

    setUint32(0x46464952); setUint32(length - 8); setUint32(0x45564157);
    setUint32(0x20746d66); setUint32(16); setUint16(1); setUint16(1);
    setUint32(abuffer.sampleRate);
    setUint32(abuffer.sampleRate * 2);
    setUint16(2); setUint16(16);
    setUint32(0x61746164); setUint32(length - pos - 4);

    const chan = abuffer.getChannelData(0);
    for (let i = 0; i < abuffer.length; i++) {
        let sample = Math.max(-1, Math.min(1, chan[i]));
        sample = (0.5 + sample < 0 ? sample * 32768 : sample * 32767) | 0;
        out.setInt16(pos, sample, true);
        pos += 2;
    }
    return new Blob([out], { type: "audio/wav" });
}
</script>
</body>
</html>
